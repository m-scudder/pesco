name: PESCO Plus checks
on:
  push:
    branches: [feat/pesco-plus]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Sync npm lockfile on feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/pesco-plus'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(pesco-plus): sync npm lockfile [skip ci]"
            git push
          fi
      - run: npm run typecheck
      - run: npm test
